<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>사다리 타기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <header class="brand">
    <div class="logo" id="logo"></div>
    <div class="brand-name" id="brandName"></div>
    <button class="mute" id="btnMute" type="button" aria-pressed="false"></button>
  </header>

  <section class="intro" id="intro">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
    <p class="hint" id="hint"></p>
  </section>

  <section class="ladder-wrap" id="ladderWrap">
    <div class="starts" id="starts" aria-label="출발점"></div>
    <svg id="ladder" aria-hidden="true"></svg>
    <div class="prizes" id="prizes" aria-label="경품"></div>
  </section>

  <section class="result" id="result" hidden>
    <div class="card" id="card">
      <div class="kicker" id="kicker"></div>
      <div class="prize" id="prize"></div>
      <div class="coupon" id="couponBox">
        <span class="lbl" id="couponLbl"></span>
        <b id="coupon"></b>
      </div>
      <div class="meta"><span id="timeLbl"></span> <span id="time"></span></div>
      <p class="show" id="show"></p>
    </div>
    <button class="again" id="btnAgain" type="button" hidden></button>
  </section>

  <footer class="foot" id="footer"></footer>
  <div class="preview" id="previewTag" hidden></div>
</main>
<canvas id="confetti"></canvas>

<script src="config.js"></script>
<script src="../shared/report.js"></script>
<script src="app.js"></script>
</body>
</html>
