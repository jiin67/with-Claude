<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>랜덤 비빔밥</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#f1e4cd;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#4a3526;-webkit-user-select:none;user-select:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 85% at 50% 45%,#0000 55%,#5a3a2040 100%)}
  #hud{position:fixed;left:0;right:0;top:0;padding:12px 14px 0;display:flex;align-items:center;gap:10px;pointer-events:none}
  #orders{position:fixed;left:0;right:0;top:58px;display:flex;justify-content:center;gap:6px;pointer-events:none;flex-wrap:wrap;padding:0 10px}
  .chip{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:5px 9px}
  .chip i{width:16px;height:16px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 2px #0002}
  .chip.done{opacity:.4}
  .pop.lbl{font-size:15px;color:#4a3526;background:#fffaf0ee;padding:4px 9px;border-radius:999px;text-shadow:none;box-shadow:0 2px 6px #0003;animation:lbl 2.4s ease-out forwards}
  .pop.stage{font-size:30px;color:#fff;background:#4a3526d9;padding:9px 22px;border-radius:16px;text-shadow:none;animation:lbl 2.3s ease-out forwards}
  @keyframes lbl{0%{opacity:0;margin-top:6px}10%,80%{opacity:1;margin-top:0}100%{opacity:0;margin-top:-10px}}
  .pill{background:#fffaf0ee;box-shadow:0 2px 8px #5a3a2033;border-radius:999px}
  #level{font-weight:800;font-size:15px;padding:7px 12px;white-space:nowrap}
  #goal{flex:1;min-width:0;padding:7px 14px 9px}
  #goalText{font-size:12px;font-weight:700;margin-bottom:4px}
  #bar{height:9px;border-radius:999px;background:#eadbc4;overflow:hidden}
  #fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#ffb23e,#e5432f);transition:width .3s}
  #restart{pointer-events:auto;border:0;color:#4a3526;font-size:13px;font-weight:800;padding:8px 12px;font-family:inherit}
  #hint{position:fixed;left:0;right:0;top:132px;text-align:center;font-size:14px;font-weight:800;pointer-events:none;transition:opacity .4s;padding:0 12px}
  #hint span{padding:8px 14px;display:inline-block}
  .pop{position:fixed;font-size:24px;font-weight:900;color:#e5432f;text-shadow:0 2px 0 #fff,0 0 8px #fff;pointer-events:none;transform:translate(-50%,-50%);animation:rise .9s ease-out forwards;white-space:nowrap}
  .pop.big{font-size:34px;color:#ff9a2e}
  @keyframes rise{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-70px}}
  .bump{animation:bump .3s}
  @keyframes bump{50%{transform:scale(1.07)}}
  .cf{position:fixed;top:-20px;width:10px;height:14px;border-radius:3px;pointer-events:none;animation:fall 1.7s ease-in forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
  #mute{pointer-events:auto;border:0;font-size:15px;padding:7px 9px;font-family:inherit}
  .list{position:fixed;transform:translate(-50%,0);display:flex;flex-wrap:wrap;justify-content:center;gap:1px;max-width:68px;background:#fffaf0e6;border-radius:9px;padding:2px 3px;pointer-events:none;box-shadow:0 1px 4px #0003}
  .list img{width:15px;height:15px;display:block}
  .list img.got{opacity:.2;filter:grayscale(1)}
  #toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#4a3526ee;color:#fff;font-size:14px;font-weight:800;padding:9px 16px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
  #trash{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);pointer-events:auto;border:0;font-family:inherit;font-size:14px;font-weight:800;color:#4a3526;padding:10px 18px;transition:transform .12s,background .12s}
  #trash.hot{background:#ffd3ca;transform:translateX(-50%) scale(1.12)}
  .pop.win{font-size:36px;color:#e5432f;animation:rise 1.4s ease-out forwards}
  #card ol{list-style:none;margin:0 0 16px;padding:0;text-align:left}
  #card li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;color:#4a3526;margin-bottom:10px}
  #card li b{flex:none;width:24px;height:24px;border-radius:50%;background:#e5432f;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
  #ovBtns{display:flex;flex-direction:column;gap:9px}
  #card button.alt{background:#eadbc4;color:#4a3526;box-shadow:0 4px 0 #cdb99b}
  #map{position:fixed;inset:0;display:none;overflow-y:auto;background:#f4ead8;z-index:20;-webkit-overflow-scrolling:touch}
  #mapIn{max-width:460px;margin:0 auto;padding:22px 16px 40px;text-align:center}
  #map h1{font-size:26px;margin:6px 0 2px} #map .sub{font-size:13px;color:#8a705c;margin:0 0 16px}
  .stage{border-radius:20px;padding:14px 14px 16px;margin-bottom:14px;text-align:left;box-shadow:0 3px 10px #5a3a2022}
  .stage h2{margin:0 0 10px;font-size:17px}
  .stage.lock{opacity:.5}
  .lvrow{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .lv{border:0;border-radius:16px;background:#fffaf0;padding:10px 4px 8px;font-family:inherit;color:#4a3526;box-shadow:0 3px 0 #0000001f}
  .lv b{display:block;font-size:20px} .lv span{font-size:14px;color:#f0a400;letter-spacing:1px}
  .lv:disabled{background:#ffffff66;color:#4a352688;box-shadow:none}
  .lv.cur{outline:3px solid #e5432f}
  #mapBtns{display:flex;gap:9px;margin-top:6px} #mapBtns button{flex:1;border:0;border-radius:999px;background:#eadbc4;color:#4a3526;font-family:inherit;font-size:14px;font-weight:800;padding:11px 6px}
  .bigstars{font-size:40px;color:#f0a400;letter-spacing:4px;margin:2px 0 8px} .bigstars i{color:#e3d6c0;font-style:normal}
  #overlay{z-index:30}
  #overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#4a352688}
  #card{background:#fffaf0;border-radius:22px;padding:24px 22px;width:min(78vw,300px);text-align:center;box-shadow:0 10px 30px #0004}
  #card h1{margin:0 0 6px;font-size:22px}
  #card p{margin:0 0 16px;font-size:14px;color:#8a705c}
  #card button{border:0;border-radius:999px;background:#e5432f;color:#fff;font-size:16px;font-weight:800;padding:12px 26px;font-family:inherit;box-shadow:0 4px 0 #b53122}
  #err{position:fixed;inset:auto 0 40% 0;text-align:center;font-size:14px;display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="hud">
  <div id="level" class="pill"></div>
  <div id="goal" class="pill"><div id="goalText"></div><div id="bar"><div id="fill"></div></div></div>
  <button id="mute" class="pill"></button>
  <button id="restart" class="pill"></button>
</div>
<div id="orders"></div>
<div id="hint"><span class="pill"></span></div>
<div id="lists"></div>
<div id="map"><div id="mapIn"></div></div>
<button id="trash" class="pill"></button>
<div id="toast"></div>
<div id="overlay"><div id="card"><h1 id="ovTitle"></h1><div id="ovBody"></div><div id="ovBtns"></div></div></div>
<div id="err">3D library failed to load. Please refresh.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
if(!window.THREE){document.getElementById('err').style.display='block';return;}

/* ---------- 언어 ---------- */
const KO=(navigator.language||'ko').toLowerCase().startsWith('ko');
const T=KO?{
  level:n=>'레벨 '+n, goal:(a,b,s)=>'주문 '+a+' / '+b+' · '+s+'점', restart:'다시',
  tutT:'랜덤 비빔밥', tut:['아래 접시를 끌어서 빈 칸에 놓아요. 접시를 누른 뒤 칸을 눌러도 돼요.','그릇 둘레 칸에 재료를 놓으면 그릇이 필요한 재료를 가져가요.','재료가 다 모이면 비빔밥 완성! 주문을 모두 내면 다음 레벨이에요.'], startBtn:'시작하기',
  mapT:'랜덤 비빔밥', mapSub:'레벨을 골라 주세요', howto:'놀이 방법', toMap:'지도로 나가기', retryLvP:'이 레벨을 다시 할까요? 지금 판은 사라져요.', resetYes:'처음부터 하기',
  movesTxt:(m,p)=>m+'수 만에 완료 · 별 셋 기준 '+p+'수', endless:n=>'무한 주문 · 레벨 '+n, mapBtn:'지도',
  used:'이미 사용 중인 칸이에요', retryT:'다시 할까요?', retryP:'처음부터 다시 하시겠어요? 진행 상황이 사라져요.', retryLevel:'레벨만 다시 하기', retryAll:'처음부터 하기', cancel:'계속하기',
  trash:n=>'🗑 버리기 '+n, trashNone:'이번 레벨 휴지통을 다 썼어요', trashBowl:'그릇은 버릴 수 없어요', trashPick:'버릴 접시를 먼저 누르거나 끌어다 놓으세요',
  hint:'그릇을 놓고, 그 둘레에 반찬을 놓으세요', hintFire:'소고기는 불을 만나야 익어요 · 육회는 생고기 그대로', hintLid:'옆에서 비빔밥을 완성하면 뚜껑이 열려요',
  plus:m=>m+' +1  ·  +100', combo:n=>'콤보 ×'+n+'!', open:'열림!',
  clearT:n=>'레벨 '+n+' 완료!', clearP:n=>'주문 '+n+'그릇을 모두 냈어요.', next:'다음 레벨',
  overT:'자리가 없어요', overP:n=>'상이 가득 찼어요. 레벨 '+n+'에서 끝났어요.', again:'다시 하기',
  ing:['시금치','당근','콩나물','표고버섯','소고기','계란프라이','불','노른자','오이','고사리','도라지','꼬막','참치','김가루','황포묵','낙지','멍게'],
  menu:{B:'비빔밥',D:'돌솥비빔밥',T:'참치비빔밥',Y:'육회비빔밥',J:'전주비빔밥',S:'산채비빔밥',K:'꼬막비빔밥',N:'낙지비빔밥',M:'멍게비빔밥'}, short:{B:'비빔밥',D:'돌솥',T:'참치',Y:'육회',J:'전주',S:'산채',K:'꼬막',N:'낙지',M:'멍게'},
  nextStage:n=>' 다음은 '+n+'!', hintFire2:'낙지도 불을 만나야 볶아져요'
}:{
  level:n=>'Level '+n, goal:(a,b,s)=>'Orders '+a+' / '+b+' · '+s+' pts', restart:'Retry',
  tutT:'Random Bibimbap', tut:['Drag a plate from the tray onto an empty spot. You can also tap a plate, then tap a spot.','Put toppings on the spots around a bowl and the bowl takes what it needs.','When every topping is in, the bibimbap is done! Serve all orders to clear the level.'], startBtn:'Start',
  mapT:'Random Bibimbap', mapSub:'Pick a level', howto:'How to play', toMap:'Back to map', retryLvP:'Retry this level? The current board will be lost.', resetYes:'Start over',
  movesTxt:(m,p)=>'Cleared in '+m+' moves · 3 stars at '+p, endless:n=>'Endless · level '+n, mapBtn:'Map',
  used:'That spot is taken', retryT:'Start over?', retryP:'Restart from the beginning? Your progress will be lost.', retryLevel:'Retry this level', retryAll:'Start from level 1', cancel:'Keep playing',
  trash:n=>'🗑 Discard '+n, trashNone:'No discards left this level', trashBowl:'Bowls cannot be discarded', trashPick:'Tap a plate first, or drag one here',
  hint:'Place a bowl, then put side dishes around it', hintFire:'Beef needs fire to cook · yukhoe takes it raw', hintLid:'Finish a bowl next to a lid to open it',
  plus:m=>m+' +1  ·  +100', combo:n=>'Combo ×'+n+'!', open:'Open!',
  clearT:n=>'Level '+n+' clear!', clearP:n=>'All '+n+' orders served.', next:'Next level',
  overT:'No space left', overP:n=>'The table is full. You reached level '+n+'.', again:'Play again',
  ing:['Spinach','Carrot','Bean sprouts','Shiitake','Beef','Fried egg','Fire','Egg yolk','Cucumber','Bracken','Bellflower root','Cockles','Tuna','Seaweed flakes','Mung bean jelly','Octopus','Sea squirt'],
  menu:{B:'Bibimbap',D:'Stone pot bibimbap',T:'Tuna bibimbap',Y:'Yukhoe bibimbap',J:'Jeonju bibimbap',S:'Wild greens bibimbap',K:'Cockle bibimbap',N:'Octopus bibimbap',M:'Sea squirt bibimbap'}, short:{B:'Classic',D:'Stone pot',T:'Tuna',Y:'Yukhoe',J:'Jeonju',S:'Greens',K:'Cockle',N:'Octopus',M:'Meongge'},
  nextStage:n=>' Next stop: '+n+'!', hintFire2:'Octopus needs fire too'
};
document.documentElement.lang=KO?'ko':'en';
document.title=KO?'랜덤 비빔밥':'Random Bibimbap';

/* ---------- 설정 ---------- */
const COLS=4, ROWS=5, GAP=1.3, N=COLS*ROWS;
const PEND_X=[-1.8,0,1.8], PEND_Z=4.65;
// 재료: 0 시금치 1 당근 2 콩나물 3 표고 4 소고기(생) 5 계란프라이 6 불 7 노른자 8 오이 9 고사리 10 도라지 11 꼬막
//       12 참치 13 김가루 14 황포묵 15 낙지 16 멍게
// 메뉴: ring 은 둘레, center 는 가운데 재료. cook 은 불로 익혀야 하는 재료.
const MEAT=4, FIRE=6, NAKJI=15;
const MENUS={
  B:{ring:[0,1,2,3,4],center:[5],cook:MEAT,dot:'#f7f3ea'},
  D:{ring:[0,1,2,3,4],center:[5],cook:MEAT,dot:'#35302d'},
  T:{ring:[12,13,2,1,8],center:[5],dot:'#ff8a50'},
  Y:{ring:[0,1,2,8],center:[4,7],dot:'#e0b54f'},
  J:{ring:[0,2,9,10,14],center:[4,7],dot:'#8e2424'},
  S:{ring:[0,3,2,9,10],center:[5],dot:'#a86f3d'},
  K:{ring:[11,8,1,2],center:[7],dot:'#9fc9b5'},
  N:{ring:[15,2,8,13],center:[5],cook:NAKJI,dot:'#34558b'},
  M:{ring:[16,13,8,0],center:[7],dot:'#f2a6a0'}
};
for(const k in MENUS){ const m=MENUS[k]; m.needs=m.ring.concat(m.center); m.spot={};
  m.ring.forEach((t,i)=>{const a=Math.PI/2+i*2*Math.PI/m.ring.length; m.spot[t]=[.33*Math.cos(a),-.33*Math.sin(a),a];});
  m.center.forEach(t=>m.spot[t]=[0,0,0]);
  if(m.cook!=null){ m.needs.push(FIRE); m.spot[FIRE]=m.spot[m.cook]; } }
// 단계: 분식집 → 한옥 → 절 → 바닷가
const THEMES={
  bunsik:{name:KO?'분식집':'Snack bar', bg:0xdfe7e4, board:0xc9d1d6, slot:0xb1bbc1, tray:0xff8a3c},
  hanok: {name:KO?'한옥':'Hanok',       bg:0xf1e4cd, board:0xc68a52, slot:0xa9713f, tray:0x9a6238},
  temple:{name:KO?'절':'Temple',        bg:0xa4a898, board:0x5a3d2b, slot:0x49301f, tray:0x3f5a45},
  sea:   {name:KO?'바닷가':'Seaside',   bg:0xead9ae, board:0x7fb7d6, slot:0x6aa3c4, tray:0xf5f0e6}
};
const LV=[
  {theme:'bunsik',orders:{B:3},             bias:.8, minN:1,maxN:2,blocked:0},
  {theme:'bunsik',orders:{B:2,T:2},         bias:.75,minN:1,maxN:3,blocked:0},
  {theme:'bunsik',orders:{B:2,T:2,D:2},     bias:.72,minN:1,maxN:3,blocked:0},
  {theme:'hanok', orders:{B:1,Y:3},         bias:.72,minN:1,maxN:3,blocked:0},
  {theme:'hanok', orders:{D:1,Y:2,J:2},     bias:.7, minN:1,maxN:3,blocked:2},
  {theme:'hanok', orders:{B:1,D:1,Y:2,J:2}, bias:.7, minN:1,maxN:3,blocked:2},
  {theme:'temple',orders:{S:3},             bias:.6, minN:2,maxN:3,blocked:3},
  {theme:'temple',orders:{S:4},             bias:.5, minN:2,maxN:3,blocked:4},
  {theme:'temple',orders:{S:5},             bias:.42,minN:2,maxN:3,blocked:5},
  {theme:'sea',   orders:{K:2,N:2},         bias:.68,minN:1,maxN:3,blocked:2},
  {theme:'sea',   orders:{K:2,N:2,M:2},     bias:.66,minN:2,maxN:3,blocked:3},
  {theme:'sea',   orders:{K:2,N:2,M:2,T:2}, bias:.64,minN:2,maxN:3,blocked:3},
  {theme:'hanok', orders:{B:2,J:2,S:2,N:2,M:2},bias:.7,minN:2,maxN:3,blocked:3}
];
const levelDef=n=>LV[Math.min(n,LV.length)-1];
const themeOf=n=>n<=LV.length?levelDef(n).theme:['hanok','bunsik','temple','sea'][(n-LV.length)%4];
const P_BOWL=.3;

/* ---------- 상태 ---------- */
let level=1, P=LV[0], left={}, total=0, done=0, score=0, levelScore=0, trashLeft=3, started=false, sel=-1;
let board=new Array(N).fill(null);    // {kind:'bowl',menu,has:[]} | {kind:'plate',items:[]}
let blocked=new Array(N).fill(null);
let pending=[null,null,null];
// 저장: 열린 레벨과 레벨별 별. 저장소를 못 쓰는 환경에서는 그냥 기억하지 않는다.
let save={unlocked:1,stars:{},tut:false};
try{ const j=JSON.parse(localStorage.getItem('bibim_save')||'null'); if(j&&j.unlocked) save=Object.assign(save,j); }catch(e){}
function store(){ try{ localStorage.setItem('bibim_save',JSON.stringify(save)); }catch(e){} }
// 별 셋 기준이 되는 놓은 수(휴지통 포함). 시뮬레이션에서 한 수 앞을 보는 봇의 평균에 맞췄다.
const PAR=[16,20,28,19,27,30,12,16,20,18,23,31,40];
const parOf=n=>PAR[Math.min(n,PAR.length)-1]+2;
const starsFor=(n,m)=>m<=parOf(n)?3:(m<=Math.ceil(parOf(n)*1.35)?2:1);
let lvMoves=0;
let busy=false, drag=null, over=false, moves=0, lidHint=false, fireHint=false, fireHint2=false, theme='';
const seen=new Set();

/* ---------- 씬 ---------- */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const C=h=>new THREE.Color(h).convertSRGBToLinear();
const scene=new THREE.Scene(); scene.background=C(0xf1e4cd);
const camera=new THREE.PerspectiveCamera(40,1,0.1,200);
const TARGET=new THREE.Vector3(0,0,1.0), DIR=new THREE.Vector3(0,1,0.62).normalize();
scene.add(new THREE.HemisphereLight(C(0xfff4e6),C(0xd9bfa0),0.5));
const sun=new THREE.DirectionalLight(C(0xfff0dc),0.8); sun.position.set(-4.5,10,5.5); sun.target.position.set(0,0,1);
sun.castShadow=true; sun.shadow.mapSize.set(1024,1024); sun.shadow.bias=-0.0006; sun.shadow.radius=4;
const sc=sun.shadow.camera; sc.left=-6; sc.right=6; sc.top=7; sc.bottom=-7; sc.near=1; sc.far=30;
scene.add(sun); scene.add(sun.target);
const fillL=new THREE.DirectionalLight(C(0xcfe0ff),0.14); fillL.position.set(5,6,-4); scene.add(fillL);

function fit(){
  const w=window.innerWidth,h=window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  const t=Math.tan(camera.fov*Math.PI/360);
  const D=Math.max(4.9/t, 3.45/(t*camera.aspect));
  camera.position.copy(TARGET).addScaledVector(DIR,D);
  camera.lookAt(TARGET);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize',fit); fit();

function cellPos(i){const c=i%COLS,r=(i/COLS)|0;return new THREE.Vector3((c-(COLS-1)/2)*GAP,0,(r-(ROWS-1)/2)*GAP);}
const mat=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:C(c),roughness:.7,metalness:0},o||{}));

/* 단계별 바닥 무늬 */
function floorTex(kind){

const plateGeo=(()=>{const g=new THREE.ExtrudeGeometry(rrShape(.98,.98,.2),{depth:.03,bevelEnabled:true,bevelSize:.025,bevelThickness:.02,bevelSegments:2,curveSegments:6}); g.rotateX(-Math.PI/2); g.translate(0,.02,0); return g;})();
const plateInGeo=(()=>{const g=new THREE.ExtrudeGeometry(rrShape(.8,.8,.14),{depth:.006,bevelEnabled:false,curveSegments:6}); g.rotateX(-Math.PI/2); g.translate(0,.071,0); return g;})();
const plateMat=mat(0xfffdf8,{roughness:.3}), plateInMat=mat(0xe9e2d4,{roughness:.5});
const TOP_Y=.168, PLATE_Y=.078;
const PLATE_POS={1:[[0,0]],2:[[-.22,0],[.22,0]],3:[[-.22,-.19],[.22,-.19],[0,.2]]};
const PLATE_SCALE={1:2.2,2:1.55,3:1.3}, BOWL_SCALE=1.22;

function applyTheme(k){
  theme=k; const th=THEMES[k];
  scene.background=C(th.bg); floorMesh.material.map=floorTexs[k]; floorMesh.material.needsUpdate=true;
  boardMesh.material.color=C(th.board); boardMesh.material.roughness=k==='bunsik'?.35:.6; slotMat.color=C(th.slot); tray.material.color=C(th.tray);
  sea.visible=k==='sea';
}
function ingMesh(t,ghost,geo){ const m=new THREE.Mesh(geo||ingGeos[t],ghost?ghostMat:ingMat); if(!ghost){m.castShadow=true; m.receiveShadow=true;} return m; }
function makeBowl(menu,needs){
  const group=new THREE.Group();
  if(menu==='D'){ const b=new THREE.Mesh(baseGeo,baseMat); b.position.y=.0; b.castShadow=true; b.receiveShadow=true; group.add(b); }
  const b=new THREE.Mesh(bowlGeo,bowlMats[menu]); b.castShadow=true; b.receiveShadow=true; group.add(b);
  const rice=new THREE.Mesh(riceGeo,riceMat); rice.scale.set(.5,.05,.5); rice.position.y=.125; rice.receiveShadow=true; group.add(rice);
  const holder=new THREE.Group(); holder.position.y=TOP_Y; group.add(holder);
  group.userData.holder=holder; scene.add(group);
  const piece={kind:'bowl',menu,has:[],group,needs:needs||MENUS[menu].needs}; makeList(piece); rebuild(piece); return piece;
}
function makePlate(items){
  const group=new THREE.Group();
  const a=new THREE.Mesh(plateGeo,plateMat); a.castShadow=true; a.receiveShadow=true; group.add(a);
  const b=new THREE.Mesh(plateInGeo,plateInMat); b.receiveShadow=true; group.add(b);
  const holder=new THREE.Group(); holder.position.y=PLATE_Y; group.add(holder);
  group.userData.holder=holder; scene.add(group);
  const piece={kind:'plate',items:items.slice(),group}; rebuild(piece); return piece;
}
function spotOf(piece,t,idx){ // 재료가 놓일 자리 [x,y,z,회전]
  if(piece.kind==='bowl'){ const m=MENUS[piece.menu], s=m.spot[t];
    let y=(m.center.indexOf(t)===1&&piece.has.includes(m.center[0]))?.1:0; if(t===FIRE) y=.15; return [s[0],y,s[1],s[2]]; }
  const pp=PLATE_POS[Math.min(3,Math.max(1,piece.items.length))][idx]||[0,0]; return [pp[0],0,pp[1],0];
}
function rebuild(piece){
  const h=piece.group.userData.holder;
  while(h.children.length) h.remove(h.children[0]);
  if(piece.kind==='bowl'){
    const mn=MENUS[piece.menu], ck=mn.cook, hasC=ck!=null&&piece.has.includes(ck), hasFire=piece.has.includes(FIRE);
    for(const t of piece.needs){
      let has=piece.has.includes(t), geo=null, sc=BOWL_SCALE;
      if(t===ck&&hasC&&hasFire) geo=COOKED[ck];                 // 불을 만나면 익은 모습
      if(t===MEAT&&ck==null&&has) geo=yukhoeGeo;                // 불 없는 메뉴에서는 육회
      if(t===FIRE){ if(hasC&&hasFire) continue; sc=.8; }        // 익힌 뒤에는 불을 따로 그리지 않는다
      const s=spotOf(piece,t), m=ingMesh(t,!has,geo);
      m.position.set(s[0],s[1]+(has?0:.004),s[2]); m.rotation.y=s[3]; m.scale.setScalar(sc); h.add(m);
    }
    if(piece.el) for(const im of piece.el.children) im.classList.toggle('got',piece.has.includes(+im.dataset.t));
  }else{
    const sc=PLATE_SCALE[Math.min(3,piece.items.length)]; piece.items.forEach((t,i)=>{ const s=spotOf(piece,t,i), m=ingMesh(t); m.position.set(s[0],0,s[2]); m.scale.setScalar(sc); h.add(m); });
  }
}

/* ---------- 트윈 ---------- */
const tweens=[];
function tween(dur,fn){return new Promise(res=>tweens.push({t:0,dur,fn,res}));}
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const back=k=>{const c=2.2;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2);};
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  for(let i=tweens.length-1;i>=0;i--){
    const w=tweens[i]; w.t+=dt; const k=Math.min(1,w.t/w.dur); w.fn(ease(k),k);
    if(k>=1){tweens.splice(i,1); w.res();}
  }
  const tt=now/1000;
  if(sea.visible){ sea.userData.fo.position.z=-5.3+Math.sin(tt*.9)*.28; sea.userData.sh.position.z=-6.4+Math.sin(tt*.9+.6)*.2; }
  for(let i=0;i<3;i++){const p=pending[i]; if(p&&!p.moving&&!p.sel&&!(drag&&drag.p===p&&drag.moved)) p.group.position.y=.055+Math.sin(tt*2.2+i*1.3)*.035;}
  placeLists();
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
function squash(g,amt,dur){ tween(dur||.28,(e,k)=>{const b=back(k); g.scale.set(1+amt*(1-b),1-amt*(1-b),1+amt*(1-b));}); }

/* ---------- 소리 ---------- */
let actx=null, master=null, muted=false;
try{ muted=localStorage.getItem('bibim_mute')==='1'; }catch(e){}
function beep(f,d,type,vol,when){
  try{
    if(!actx) return;
    const t0=actx.currentTime+(when||0), o=actx.createOscillator(), g=actx.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t0); g.gain.setValueAtTime(vol||.08,t0);
    g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0+d+.02);
  }catch(e){}
}
const sfx={
  click:()=>beep(880,.045,'square',.035),
  pick:()=>beep(440,.05),
  place:()=>beep(330,.06),
  absorb:n=>{beep(500+n*50,.07); beep(750+n*50,.06,'sine',.05,.05);},
  error:()=>beep(150,.16,'sawtooth',.05),
  trash:()=>{beep(420,.08,'triangle'); beep(260,.14,'triangle',.07,.07);},
  win:()=>{[784,988,1175,1568].forEach((f,i)=>beep(f,.22,'triangle',.09,i*.09));}
};
// 배경음악: 오음계 가락을 조금씩 예약해서 계속 이어 붙인다
const SCALE=[261.63,293.66,329.63,392,440,523.25,587.33,659.25];
const TUNE=[4,-1,5,4,2,-1,1,2, 4,-1,2,1,0,-1,-1,-1, 2,-1,4,5,7,-1,5,4, 2,-1,1,2,1,-1,0,-1];
let step=0, nextT=0;
function startMusic(){
  nextT=actx.currentTime+.3;
  setInterval(()=>{
    if(!actx||actx.state!=='running') return;
    if(nextT<actx.currentTime) nextT=actx.currentTime+.1;
    while(nextT<actx.currentTime+.6){
      const n=TUNE[step%TUNE.length], w=nextT-actx.currentTime;
      if(n>=0) beep(SCALE[n],.7,'triangle',.026,w);
      if(step%8===0) beep(SCALE[[0,2,0,1][((step/8)|0)%4]]/2,1.5,'sine',.03,w);
      step++; nextT+=.34;
    }
  },200);
}
function initAudio(){
  if(actx) return;
  try{ actx=new (window.AudioContext||window.webkitAudioContext)(); master=actx.createGain(); master.gain.value=muted?0:1; master.connect(actx.destination); startMusic(); }catch(e){ actx=null; }
}
document.addEventListener('visibilitychange',()=>{ try{ if(actx) (document.hidden?actx.suspend():actx.resume()); }catch(e){} });
const muteEl=document.getElementById('mute');
function drawMute(){ muteEl.textContent=muted?'🔇':'🔊'; }
muteEl.onclick=()=>{ initAudio(); muted=!muted; if(master) master.gain.value=muted?0:1; try{localStorage.setItem('bibim_mute',muted?'1':'0');}catch(e){} drawMute(); sfx.click(); };
drawMute();

/* ---------- 규칙 ---------- */
function around(i){ // 둘레 여덟 칸
  const c=i%COLS,r=(i/COLS)|0,o=[];
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){ if(!dr&&!dc) continue; const x=c+dc,y=r+dr; if(x>=0&&x<COLS&&y>=0&&y<ROWS) o.push(y*COLS+x); }
  return o;
}
// 접시 위 재료 가운데, 둘레의 그릇이 아직 못 채운 재료 하나를 찾는다. 완성에 가까운 그릇이 먼저 받는다.
function findMove(){
  let best=null;
  for(let i=0;i<N;i++){
    const pl=board[i]; if(!pl||pl.kind!=='plate') continue;
    for(const j of around(i)){
      const bw=board[j]; if(!bw||bw.kind!=='bowl') continue;
      for(const t of pl.items){
        if(!bw.needs.includes(t)||bw.has.includes(t)) continue;
        const score=bw.has.length; if(!best||score>best.score) best={from:i,to:j,t,score};
      }
    }
  }
  return best;
}
async function doMove(m){
  const S=board[m.from], D=board[m.to];
  const idx=S.items.indexOf(m.t), s0=spotOf(S,m.t,idx), sc0=PLATE_SCALE[Math.min(3,S.items.length)];
  const a=cellPos(m.from).add(new THREE.Vector3(s0[0],PLATE_Y,s0[2]));
  S.items.splice(idx,1); rebuild(S);
  D.has.push(m.t); const s1=spotOf(D,m.t); D.has.pop();
  const b=cellPos(m.to).add(new THREE.Vector3(s1[0],TOP_Y+s1[1],s1[2]));
  const fly=ingMesh(m.t); scene.add(fly);
  await tween(.16,k=>{fly.position.lerpVectors(a,b,k); fly.position.y+=Math.sin(Math.PI*k)*.9; fly.rotation.y=s1[3]*k; fly.scale.setScalar(sc0+(BOWL_SCALE-sc0)*k+Math.sin(Math.PI*k)*.25);});
  scene.remove(fly);
  D.has.push(m.t); rebuild(D); squash(D.group,.12,.2); sfx.absorb(D.has.length);
  const ck=MENUS[D.menu].cook; if(ck!=null&&(m.t===ck||m.t===FIRE)&&D.has.includes(ck)&&D.has.includes(FIRE)){ // 치익
    const f=ingMesh(FIRE); f.position.copy(b); scene.add(f); beep(140,.25,'sawtooth');
    tween(.45,(e,k)=>{f.position.y=b.y+k*.6; f.scale.setScalar(Math.max(.001,1.6*(1-k)));}).then(()=>scene.remove(f));
  }
  if(S.items.length===0) await removePiece(m.from);
  if(D.has.length===D.needs.length) await completeBowl(m.to);
}
async function removePiece(i){
  const B=board[i]; board[i]=null;
  await tween(.15,k=>B.group.scale.setScalar(Math.max(.001,1-k)));
  scene.remove(B.group);
}
function sparkle(pos){
  for(let n=0;n<18;n++){
    const s=new THREE.Mesh(sparkGeo,sparkMats[n%sparkMats.length]); scene.add(s);
    const a=Math.random()*6.283, sp=1.2+Math.random()*1.6, vy=2.5+Math.random()*2;
    tween(.6,(e,k)=>{ s.position.set(pos.x+Math.cos(a)*sp*k, .6+vy*k-4.5*k*k, pos.z+Math.sin(a)*sp*k); s.scale.setScalar(Math.max(.001,1-k)); })
      .then(()=>scene.remove(s));
  }
}
function toScreen(x,z){const v=new THREE.Vector3(x,0,z).project(camera);return [(v.x+1)/2*window.innerWidth,(1-v.y)/2*window.innerHeight];}
function popup(pos,text,cls,dy){
  const [x,y]=toScreen(pos.x,pos.z); const d=document.createElement('div');
  d.className='pop'+(cls?' '+cls:''); d.textContent=text; d.style.left=Math.max(cls==='win'?120:60,Math.min(window.innerWidth-(cls==='win'?120:60),x))+'px'; d.style.top=(y-(dy==null?30:dy))+'px';
  document.body.appendChild(d); setTimeout(()=>d.remove(),(cls==='lbl'||cls==='stage')?2400:(cls==='win'?1400:950));
}
const lidGeo=new THREE.CylinderGeometry(.5,.6,.16,40), lidMat=mat(0x6b4a32,{roughness:.55}), knobGeo=new THREE.SphereGeometry(.1,16,12), knobMat=mat(0x4a3222,{roughness:.4});
function makeLid(i){
  const g=new THREE.Group(); const a=new THREE.Mesh(lidGeo,lidMat); a.position.y=.08; a.castShadow=true; a.receiveShadow=true; g.add(a);
  const k=new THREE.Mesh(knobGeo,knobMat); k.position.y=.21; k.castShadow=true; g.add(k);
  g.position.copy(cellPos(i)); scene.add(g); return g;
}
function openLid(j){

  tween(.4,(e,k)=>{L.position.y=k*1.8; L.rotation.z=k*1.4; L.scale.setScalar(Math.max(.001,1-k*k));}).then(()=>scene.remove(L));
}
const dustGeo=new THREE.RingGeometry(.56,.66,40);
function dust(pos){
  const m=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.7,depthWrite:false});
  const r=new THREE.Mesh(dustGeo,m); r.rotation.x=-Math.PI/2; r.position.set(pos.x,.03,pos.z); scene.add(r);

function hudPoint(){

  ndc.set((r.left+r.width/2)/window.innerWidth*2-1, -((r.top+r.height/2)/window.innerHeight)*2+1);

function confetti(){
  const cols=['#3f9a3c','#ff8a1f','#e0446a','#f2cf4a','#7a5236','#e5432f'];
  for(let i=0;i<40;i++){const d=document.createElement('div'); d.className='cf'; d.style.left=(Math.random()*100)+'vw';

// 메뉴의 재료가 다 모이면 비벼서 낸다.
async function completeBowl(i){
  const B=board[i], pos=cellPos(i); board[i]=null; dropList(B);
  sfx.win();
  const h=B.group.userData.holder;
  await tween(.45,(e,k)=>{h.rotation.y=e*Math.PI*4; B.group.position.y=.02+Math.sin(Math.PI*k)*.5; B.group.scale.setScalar(1+Math.sin(Math.PI*k)*.25);});
  sparkle(pos); popup(pos,T.plus(T.menu[B.menu]),'win',50);
  for(const j of around(i)) if(blocked[j]) openLid(j);
  const from=B.group.position.clone(), to=hudPoint();
  await tween(.34,k=>{B.group.position.lerpVectors(from,to,k); B.group.scale.setScalar(1-.75*k); B.group.rotation.y=k*5;});
  scene.remove(B.group);
  left[B.menu]--; done++; score+=100; updateHud();
  const gEl=document.getElementById('orders'); gEl.classList.remove('bump'); void gEl.offsetWidth; gEl.classList.add('bump');
}
async function resolve(){
  busy=true; const before=done;
  for(let guard=0;guard<400;guard++){ const m=findMove(); if(!m) break; await doMove(m); }
  busy=false;
  if(done-before>=2) popup(new THREE.Vector3(0,0,0),T.combo(done-before),'big');
  if(done>=total){ confetti();
    const st=starsFor(level,lvMoves), nx=themeOf(level+1);
    save.stars[level]=Math.max(save.stars[level]||0,st); save.unlocked=Math.max(save.unlocked,level+1); store();
    const box=document.createElement('div'), big=document.createElement('div'), p1=document.createElement('p'), p2=document.createElement('p');
    big.className='bigstars'; big.append('★'.repeat(st)); const dim=document.createElement('i'); dim.textContent='★'.repeat(3-st); big.appendChild(dim);
    p1.textContent=T.clearP(total)+(nx!==theme?T.nextStage(THEMES[nx].name):''); p2.textContent=T.movesTxt(lvMoves,parOf(level));
    box.appendChild(big); box.appendChild(p1); box.appendChild(p2);
    return show(T.clearT(level),box,[{label:T.next,fn:()=>{level++;start();}},{label:T.toMap,alt:true,fn:openMap}]); }
  if(pending.every(p=>!p)) refill();
  if(board.every((p,i)=>p||blocked[i])){ beep(196,.4,'sawtooth'); return show(T.overT,T.overP(level),[{label:T.retryLevel,fn:()=>{score=levelScore;start();}},{label:T.toMap,alt:true,fn:openMap}]); }
}

/* ---------- 조각 만들기 ---------- */
const rnd=n=>Math.floor(Math.random()*n);
function nextPiece(made){
  const want=Object.assign({},left);
  const bowls=board.concat(pending,made).filter(p=>p&&p.kind==='bowl'); bowls.forEach(b=>want[b.menu]--);
  const avail=Object.keys(want).filter(m=>want[m]>0);
  if(avail.length&&(bowls.length===0||Math.random()<P_BOWL)) return makeBowl(avail[rnd(avail.length)]);
  const pool=[...new Set(Object.keys(left).filter(m=>left[m]>0).reduce((a,m)=>a.concat(MENUS[m].needs),[]))];
  const miss=[]; bowls.forEach(b=>b.needs.forEach(t=>{ if(!b.has.includes(t)) miss.push(t); }));
  const n=P.minN+rnd(P.maxN-P.minN+1), items=[];
  for(let i=0;i<n;i++) items.push(miss.length&&Math.random()<P.bias?miss[rnd(miss.length)]:pool[rnd(pool.length)]);
  return makePlate(items);
}
function labelPiece(i){ // 처음 보는 재료와 그릇은 이름표를 잠깐 띄운다
  const p=pending[i]; if(!p||!started) return;
  if(p.kind==='bowl'){ if(!seen.has('m'+p.menu)){ seen.add('m'+p.menu); popup(p.home,T.menu[p.menu],'lbl',58); } }
  else { const fresh=[...new Set(p.items)].filter(t=>!seen.has(t)); fresh.forEach(t=>seen.add(t)); if(fresh.length) popup(p.home,fresh.map(t=>T.ing[t]).join(' · '),'lbl',58);
    if(fresh.includes(FIRE)&&!fireHint){ fireHint=true; setHint(T.hintFire,6000); }
    if(fresh.includes(NAKJI)&&!fireHint2){ fireHint2=true; setHint(T.hintFire2,6000); } }
}
function refill(preset){
  const made=[];
  for(let i=0;i<3;i++){
    const p=preset?preset[i]:nextPiece(made); made.push(p);
    p.home=new THREE.Vector3(PEND_X[i],.02,PEND_Z);
    p.group.position.copy(p.home); p.group.scale.setScalar(.001);
    tween(.3+i*.06,(e,k)=>p.group.scale.setScalar(Math.max(.001,back(k))));
    pending[i]=p;
    setTimeout(()=>{ if(pending[i]===p) labelPiece(i); },450+i*120);
  }
}
function setHint(text,ms){ const h=document.getElementById('hint'); h.firstElementChild.textContent=text; h.style.opacity=1; if(ms) setTimeout(()=>{h.style.opacity=0;},ms); }
function start(){
  tweens.length=0; busy=false; over=false; drag=null; ring.visible=false;
  board.concat(pending).forEach(p=>{ if(p){ dropList(p); scene.remove(p.group); } }); blocked.forEach(m=>m&&scene.remove(m));
  sel=-1; trashLeft=3; levelScore=score; lvMoves=0; updateTrash();
  board=new Array(N).fill(null); pending=[null,null,null]; blocked=new Array(N).fill(null);
  P=levelDef(level); left=Object.assign({},P.orders);
  const th=themeOf(level); if(th!==theme){ applyTheme(th); setTimeout(()=>popup(new THREE.Vector3(0,0,-1.2),THEMES[th].name,'stage'),250); }
  for(let x=LV.length;x<level;x++){ const ks=Object.keys(left); left[ks[x%ks.length]]++; }
  total=Object.values(left).reduce((a,b)=>a+b,0); done=0;
  for(let n=0,tries=0;n<P.blocked&&tries<300;tries++){ const i=rnd(N); if(blocked[i]) continue; blocked[i]=makeLid(i); n++; }
  if(P.blocked&&!lidHint){ lidHint=true; setHint(T.hintLid,6000); }
  // 레벨 1의 첫 그릇은 재료 두 가지만 있으면 완성된다
  refill(level===1?[makeBowl('B',[1,5]),makePlate([1]),makePlate([5])]:null); updateHud();
  document.getElementById('overlay').style.display='none';
}

/* ---------- HUD ---------- */
function updateHud(){
  { const n=starsFor(level,lvMoves); document.getElementById('level').textContent=T.level(level)+' '+'★'.repeat(n)+'☆'.repeat(3-n); }
  document.getElementById('goalText').textContent=T.goal(Math.min(done,total),total,score);
  document.getElementById('fill').style.width=(100*Math.min(1,done/Math.max(1,total)))+'%';
  const o=document.getElementById('orders'); o.textContent='';
  for(const m of Object.keys(P.orders)){ const d=document.createElement('div'); d.className='pill chip'+(left[m]<=0?' done':'');
    const i=document.createElement('i'); i.style.background=MENUS[m].dot; d.appendChild(i);
    d.appendChild(document.createTextNode(T.short[m]+' ×'+Math.max(0,left[m]))); o.appendChild(d); }
}
function show(title,body,buttons){
  over=true;
  document.getElementById('ovTitle').textContent=title;
  const b=document.getElementById('ovBody'); b.textContent='';
  if(typeof body==='string'){ const p=document.createElement('p'); p.textContent=body; b.appendChild(p); } else b.appendChild(body);
  const row=document.getElementById('ovBtns'); row.textContent='';
  for(const bt of buttons){ const el=document.createElement('button'); el.textContent=bt.label; if(bt.alt) el.className='alt'; el.onclick=()=>{ initAudio(); sfx.click(); bt.fn(); }; row.appendChild(el); }
  document.getElementById('overlay').style.display='flex';
}
function closeOverlay(){ over=false; document.getElementById('overlay').style.display='none'; }
document.getElementById('restart').textContent=T.restart;
document.getElementById('restart').onclick=()=>{
  if(!started||document.getElementById('overlay').style.display==='flex') return;
  initAudio(); sfx.click();
  show(T.retryT,T.retryLvP,[{label:T.retryLevel,fn:()=>{score=levelScore;start();}},{label:T.toMap,alt:true,fn:openMap},{label:T.cancel,alt:true,fn:closeOverlay}]);
};
const toastEl=document.getElementById('toast'); let toastT=0;
function toast(msg){ toastEl.textContent=msg; toastEl.style.opacity=1; clearTimeout(toastT); toastT=setTimeout(()=>{toastEl.style.opacity=0;},1600); }
const trashEl=document.getElementById('trash');
function updateTrash(){ trashEl.textContent=T.trash(trashLeft); trashEl.style.opacity=trashLeft>0?1:.5; }

/* ---------- 조작 ---------- */
const ray=new THREE.Raycaster(), ground=new THREE.Plane(new THREE.Vector3(0,1,0),0), ndc=new THREE.Vector2(), hit=new THREE.Vector3();
function groundPoint(e){
  ndc.set(e.clientX/window.innerWidth*2-1, -(e.clientY/window.innerHeight)*2+1);
  ray.setFromCamera(ndc,camera);
  return ray.ray.intersectPlane(ground,hit)?hit:null;
}
function nearestEmpty(x,z){
  let best=-1,bd=.95*.95;
  for(let i=0;i<N;i++){ if(board[i]||blocked[i]) continue; const p=cellPos(i); const d=(p.x-x)*(p.x-x)+(p.z-z)*(p.z-z); if(d<bd){bd=d;best=i;} }
  return best;
}
function nearestCell(x,z,r){
  let best=-1,bd=r*r;
  for(let i=0;i<N;i++){ const p=cellPos(i); const d=(p.x-x)*(p.x-x)+(p.z-z)*(p.z-z); if(d<bd){bd=d;best=i;} }
  return best;
}
function setSel(i){ // 눌러서 고른 접시는 살짝 떠 있다
  if(sel>=0&&pending[sel]){ const q=pending[sel]; q.sel=false; q.group.scale.setScalar(1); }
  sel=i;
  if(i>=0){ const p=pending[i]; p.sel=true; p.group.position.set(p.home.x,.42,p.home.z); p.group.scale.setScalar(1.14); }
}
function goHome(p){ const from=p.group.position.clone(); p.moving=true; tween(.18,k=>p.group.position.lerpVectors(from,p.home,k)).then(()=>{p.moving=false;}); }
function placeAt(i,cell){
  const p=pending[i]; if(sel===i){ p.sel=false; sel=-1; }
  const to=cellPos(cell); to.y=.02;
  p.group.scale.setScalar(1); p.group.position.copy(to); squash(p.group,.22,.3); dust(to);
  board[cell]=p; pending[i]=null; sfx.place();
  if(++moves===3) document.getElementById('hint').style.opacity=0;
  lvMoves++; updateHud();
  resolve();
}
function discard(i){ // 필요 없는 반찬 접시 버리기. 레벨마다 세 번.
  const p=pending[i]; if(!p) return false;
  if(p.kind==='bowl'){ toast(T.trashBowl); sfx.error(); return false; }
  if(trashLeft<=0){ toast(T.trashNone); sfx.error(); return false; }
  trashLeft--; updateTrash(); lvMoves++; updateHud(); if(sel===i){ p.sel=false; sel=-1; }
  pending[i]=null; sfx.trash();
  tween(.2,k=>p.group.scale.setScalar(Math.max(.001,1-k))).then(()=>scene.remove(p.group));
  if(pending.every(x=>!x)) refill();
  return true;
}
function overTrash(e){ const r=trashEl.getBoundingClientRect(); return e.clientX>r.left-16&&e.clientX<r.right+16&&e.clientY>r.top-16&&e.clientY<r.bottom+16; }
trashEl.onclick=()=>{ if(!started||busy||over) return; initAudio(); if(sel>=0) discard(sel); else { toast(T.trashPick); sfx.click(); } };

canvas.addEventListener('pointerdown',e=>{
  if(!started||busy||over||drag) return;
  initAudio();
  const g=groundPoint(e); if(!g) return;
  for(let i=0;i<3;i++){
    const p=pending[i]; if(!p) continue;
    if(Math.hypot(p.home.x-g.x,p.home.z-g.z)<1.0){
      drag={i,p,cell:-1,id:e.pointerId,sx:e.clientX,sy:e.clientY,moved:false,off:e.pointerType==='mouse'?0:.7};
      try{canvas.setPointerCapture(e.pointerId);}catch(_){}
      return;
    }
  }
  if(sel>=0){ // 고른 접시가 있으면 누른 칸에 놓는다
    const c=nearestCell(g.x,g.z,.7);
    if(c<0){ setSel(-1); return; }
    if(board[c]||blocked[c]){ toast(T.used); sfx.error(); return; }
    placeAt(sel,c);
  }
});
function moveDrag(g,e){
  const x=g.x, z=g.z-drag.off;
  drag.p.group.position.set(x,.6,z);
  drag.cell=nearestEmpty(x,z); drag.any=nearestCell(x,z,.66);
  ring.visible=drag.cell>=0;
  if(ring.visible){ring.position.copy(cellPos(drag.cell)); ring.position.y=.02;}
  trashEl.classList.toggle('hot',overTrash(e));
}
canvas.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id) return;
  if(!drag.moved){
    if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<8) return;
    drag.moved=true; if(sel>=0) setSel(-1); drag.p.group.scale.setScalar(1.12); sfx.pick();
  }
  const g=groundPoint(e); if(g) moveDrag(g,e);
});
function endDrag(e){
  if(!drag||e.pointerId!==drag.id) return;
  // 빠르게 끌면 이동 이벤트가 거의 없이 끝나기도 하므로, 뗀 자리로 한 번 더 계산한다
  if(!drag.moved&&e.type==='pointerup'&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>=8){ drag.moved=true; if(sel>=0) setSel(-1); }
  if(!drag.moved){ const i=drag.i; drag=null; if(e.type==='pointerup'){ setSel(sel===i?-1:i); sfx.pick(); } return; }
  if(e.type==='pointerup'){ const g=groundPoint(e); if(g) moveDrag(g,e); }
  const d=drag; drag=null; ring.visible=false; trashEl.classList.remove('hot'); d.p.group.scale.setScalar(1);
  if(e.type==='pointerup'&&overTrash(e)){ if(!discard(d.i)) goHome(d.p); return; }
  if(e.type==='pointerup'&&d.cell>=0){ placeAt(d.i,d.cell); return; }
  if(d.any>=0&&(board[d.any]||blocked[d.any])){ toast(T.used); sfx.error(); }
  goHome(d.p);
}
canvas.addEventListener('pointerup',endDrag);
canvas.addEventListener('pointercancel',endDrag);

setHint(T.hint);
start();
/* ---------- 단계 지도 ---------- */
const STAGES=[['bunsik',[1,2,3]],['hanok',[4,5,6]],['temple',[7,8,9]],['sea',[10,11,12]]];
const STAGE_BG={bunsik:'#dfe9e6',hanok:'#ecd2ae',temple:'#c3c9b6',sea:'#bfe0ee'};
const mapEl=document.getElementById('map'), mapIn=document.getElementById('mapIn');
function el(tag,cls,text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function lvButton(n,label){
  const b=el('button','lv'+(n===save.unlocked?' cur':'')), st=save.stars[n]||0;
  b.appendChild(el('b',null,n>save.unlocked?'🔒':(label||n))); b.appendChild(el('span',null,n>save.unlocked?' ':'★'.repeat(st)+'☆'.repeat(3-st)));
  b.disabled=n>save.unlocked; b.onclick=()=>{ initAudio(); sfx.click(); playLevel(n); }; return b;
}
function renderMap(){
  mapIn.textContent=''; mapIn.appendChild(el('h1',null,T.mapT)); mapIn.appendChild(el('p','sub',T.mapSub));
  for(const [k,lvs] of STAGES){
    const card=el('div','stage'+(lvs[0]>save.unlocked?' lock':'')); card.style.background=STAGE_BG[k];
    card.appendChild(el('h2',null,THEMES[k].name)); const row=el('div','lvrow'); lvs.forEach(n=>row.appendChild(lvButton(n))); card.appendChild(row); mapIn.appendChild(card);
  }
  if(save.unlocked>12){ const n=save.unlocked, card=el('div','stage'); card.style.background='#f3d9d2'; card.appendChild(el('h2',null,T.endless(n)));
    const row=el('div','lvrow'); row.appendChild(lvButton(n)); card.appendChild(row); mapIn.appendChild(card); }
  const bt=el('div'); bt.id='mapBtns';
  const h=el('button',null,T.howto); h.onclick=()=>{ initAudio(); sfx.click(); showTutorial(closeOverlay); };
  const r=el('button',null,T.retryAll); r.onclick=()=>{ initAudio(); sfx.click();
    show(T.retryT,T.retryP,[{label:T.resetYes,fn:()=>{ save={unlocked:1,stars:{},tut:true}; store(); closeOverlay(); renderMap(); }},{label:T.cancel,alt:true,fn:closeOverlay}]); };
  bt.appendChild(h); bt.appendChild(r); mapIn.appendChild(bt);
}
function openMap(){ started=false; closeOverlay(); setSel(-1); renderMap(); mapEl.style.display='block'; mapEl.scrollTop=0; }
function playLevel(n){ level=n; score=0; mapEl.style.display='none'; start(); started=true; for(let i=0;i<3;i++) labelPiece(i); }
function showTutorial(done){ // 규칙 세 줄
  const ol=document.createElement('ol');
  T.tut.forEach((t,i)=>{ const li=document.createElement('li'), b=document.createElement('b'), sp=document.createElement('span'); b.textContent=i+1; sp.textContent=t; li.appendChild(b); li.appendChild(sp); ol.appendChild(li); });
  show(T.tutT,ol,[{label:T.startBtn,fn:done}]);
}
// 처음 온 사람은 규칙을 보고 바로 레벨 1, 다시 온 사람은 지도부터
if(!save.tut) showTutorial(()=>{ save.tut=true; store(); started=true; closeOverlay(); for(let i=0;i<3;i++) labelPiece(i); });
else openMap();
window.__game={get board(){return board;},get blocked(){return blocked;},get pending(){return pending;},get busy(){return busy;},get left(){return left;},get score(){return score;},get save(){return save;},debugClear(){ for(const k in left) left[k]=0; done=total; return resolve(); },get sel(){return sel;},set level(v){level=v;start();},findMove,resolve,toScreen,cellPos,around};
})();
</script>
