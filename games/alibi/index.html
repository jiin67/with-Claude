<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ALIBI</title>
<meta name="description" content="Deduction game: read a group chat, compare it with the evidence, catch the lies and accuse the culprit. 16+ cases plus a daily case, 3–5 minutes each.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="phone">
  <div class="status"><span id="clock">9:41</span><span class="pills"><i></i><i></i><i></i></span></div>

  <!-- title -->
  <section id="title" class="screen">
    <div class="hero">
      <div class="badge">DETECTIVE · CHAT</div>
      <h1>ALIBI</h1>
      <p class="lede" data-i18n="tagline"></p>
      <button class="btn primary big" id="btnStart" data-i18n="start"></button>
      <div class="row"><button class="btn ghost" id="btnTitleSettings" data-i18n="settings"></button><span class="muted" id="titleStars"></span></div>
    </div>
  </section>

  <!-- case list -->
  <section id="list" class="screen" hidden>
    <header class="top"><button class="link" id="btnListBack">‹</button><b data-i18n="cases"></b><button class="link" id="btnListSettings">⚙</button></header>
    <div id="caseList" class="cases"></div>
  </section>

  <!-- case -->
  <section id="case" class="screen" hidden>
    <header class="top"><button class="link" id="btnCaseBack">‹</button><div class="tt"><b id="caseTitle"></b><span id="casePlace"></span></div><button class="link" id="btnHint">?</button></header>
    <div class="meter"><span id="lieMeter"></span><span id="timeMeter"></span><span id="strikeMeter"></span></div>
    <nav class="tabs"><button data-tab="chat" aria-selected="true" data-i18n="tabChat"></button><button data-tab="evidence" aria-selected="false" data-i18n="tabEvidence"></button><button data-tab="suspects" aria-selected="false" data-i18n="tabSuspects"></button></nav>
    <div class="pane" id="paneChat"></div>
    <div class="pane side" id="paneEvidence" hidden><h4 class="pane-title" data-i18n="tabEvidence"></h4><div id="factList"></div></div>
    <div class="pane side" id="paneSuspects" hidden><h4 class="pane-title" data-i18n="tabSuspects"></h4><div id="susList"></div></div>
    <div class="coach" id="coach" hidden><span id="coachText"></span></div>
    <div class="bottom"><button class="btn primary wide" id="btnAccuse" disabled data-i18n="accuse"></button></div>
    <div class="sheet" id="sheet" hidden><div class="sheet-card" id="sheetCard"></div></div>
  </section>

  <!-- result -->
  <section id="result" class="screen" hidden>
    <div class="hero">
      <div class="badge" id="resBadge"></div>
      <h2 id="resTitle"></h2>
      <div class="stars" id="resStars"></div>
      <p class="lede" id="resBody"></p>
      <div class="res-meta" id="resMeta"></div>
      <button class="btn primary big" id="btnResNext"></button>
      <div class="row"><button class="btn ghost" id="btnResShare" data-i18n="share"></button><button class="btn ghost" id="btnResList" data-i18n="toList"></button></div>
    </div>
  </section>
</div>

<div class="modal" id="hintModal" hidden><div class="card"><h2 data-i18n="hint"></h2><p id="hintText"></p><div class="row"><button class="btn primary" id="btnHintTake"></button><button class="btn ghost" id="btnHintClose" data-i18n="close"></button></div></div></div>
<div class="modal" id="settings" hidden><div class="card">
  <h2 data-i18n="settings"></h2>
  <label class="opt"><span data-i18n="sound"></span><input type="checkbox" id="optSound"></label>
  <label class="opt"><span data-i18n="music"></span><input type="checkbox" id="optMusic"></label>
  <label class="opt"><span data-i18n="language"></span><select id="optLang"><option value="en">English</option><option value="ko">한국어</option></select></label>
  <div class="danger-zone"><p class="muted" data-i18n="resetWarn"></p><div class="row"><button class="btn ghost" id="btnReset" data-i18n="reset"></button><button class="btn danger" id="btnResetConfirm" hidden data-i18n="resetConfirm"></button></div></div>
  <div class="row"><button class="btn" id="btnSettingsClose" data-i18n="close"></button></div>
</div></div>
<div id="toasts"></div>

<script src="js/cases.js"></script>
<script src="js/cases-a.js"></script>
<script src="js/cases-b.js"></script>
<script src="js/cases-c.js"></script>
<script src="js/cases-d.js"></script>
<script src="js/cases-e.js"></script>
<script src="js/cases-f.js"></script>
<script src="js/cases-g.js"></script>
<script src="js/i18n.js"></script>
<script src="js/portal.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
