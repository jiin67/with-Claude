<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap">
<style>
html,body{margin:0;width:100vw;height:100vh;overflow:hidden;background:#0f1016;font-family:'Inter',sans-serif}
svg{position:absolute;inset:0;width:100%;height:100%}
.box{position:absolute;right:5%;top:44%;transform:translateY(-50%);text-align:right;width:40%}
.badge{display:inline-block;font-size:var(--es);font-weight:700;letter-spacing:.2em;color:#ff6a3d;border:.3vmin solid #ff6a3d;padding:.8vmin 1.6vmin;border-radius:99px;margin-bottom:2vmin}
h1{margin:0;font-weight:800;font-size:var(--fs);line-height:.9;letter-spacing:-.05em;color:#fff;text-shadow:0 1vmin 4vmin rgba(0,0,0,.6)}
.sub{color:#dfe2ee;font-size:var(--ss);margin-top:2vmin;font-weight:500}
body.portrait .box{right:8%;left:8%;top:auto;bottom:6%;transform:none;text-align:left;width:auto}
body.icon .box{display:none}
</style></head><body>

<div class="box"><div class="badge">DETECTIVE · DEDUCTION</div><h1 id="h">ALIBI</h1><div class="sub" id="s">Read the chat. Catch the lie.</div></div>
<script>const q=new URLSearchParams(location.search), m=Math.min(innerWidth, innerHeight*1.5), r=document.documentElement.style;
r.setProperty('--fs',(m*.105)+'px'); r.setProperty('--ss',(m*.022)+'px'); r.setProperty('--es',(m*.016)+'px');
const art=document.getElementById('art');
if (innerHeight > innerWidth) { document.body.classList.add('portrait'); art.setAttribute('viewBox','230 200 900 880'); }
if (q.get('icon')) { document.body.classList.add('icon'); art.setAttribute('viewBox','250 250 620 620'); }
if (q.get('ko')) { document.getElementById('h').textContent='알리바이'; document.getElementById('s').textContent='채팅을 읽고, 증거와 대조하고, 거짓말을 잡아라.'; }</script></body></html>
