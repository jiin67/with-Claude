<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>별표류 STARDRIFT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="10분을 버티는 네온 우주 생존 슈팅 게임. 브라우저에서 바로 플레이.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Chakra+Petch:wght@500;700&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
/* Layout: full-bleed canvas world; thin HUD pinned to the edges; menus are glass panels floating over the live starfield. */
:root{
  --void:#070614;          /* deep space */
  --deep:#141033;          /* panel fill */
  --ink:#ece9ff;           /* primary text */
  --dim:#9d96cc;           /* secondary text */
  --ice:#7ef0ff;           /* player, friendly */
  --rose:#ff4fa3;          /* hostiles */
  --amber:#ffc24a;         /* experience, rewards */
  --mint:#5affb4;          /* hull, healing */
  --line:rgba(158,140,255,.24);
  --f-display:'Black Han Sans','Noto Sans KR',system-ui,sans-serif;
  --f-body:'Noto Sans KR',system-ui,-apple-system,sans-serif;
  --f-num:'Chakra Petch',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--void);color:var(--ink);font-family:var(--f-body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
canvas{position:fixed;inset:0;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ice);outline-offset:3px}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;font-family:var(--f-num)}
.xpbar{position:absolute;left:0;right:0;top:0;height:calc(5px + env(safe-area-inset-top,0px));background:rgba(255,194,74,.12)}
.xpbar i{position:absolute;left:0;bottom:0;height:5px;width:0;background:var(--amber);box-shadow:0 0 12px var(--amber);transition:width .12s linear}
.hud-top{position:absolute;left:0;right:0;top:calc(14px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.hp{display:flex;align-items:center;gap:8px;min-width:0}
.hp .lbl,.stat .lbl{font-size:11px;letter-spacing:.16em;color:var(--dim)}
.hpbar{position:relative;width:min(160px,26vw);height:8px;border:1px solid rgba(90,255,180,.45);border-radius:2px;overflow:hidden}
.hpbar i{position:absolute;inset:0 auto 0 0;width:100%;background:var(--mint);box-shadow:0 0 10px var(--mint);transition:width .15s}
#hptext{font-size:13px;font-variant-numeric:tabular-nums;color:var(--mint)}
.timer{font-size:clamp(22px,4vw,30px);font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums;text-shadow:0 0 14px rgba(126,240,255,.5)}
.right{display:flex;justify-content:flex-end;align-items:center;gap:14px;font-size:13px;font-variant-numeric:tabular-nums}
.stat{display:flex;align-items:baseline;gap:6px}
.stat b{font-size:15px}
.iconbtn{pointer-events:auto;width:34px;height:34px;border:1px solid var(--line);background:rgba(20,16,51,.6);border-radius:8px;font-family:var(--f-num);font-size:13px;font-weight:700;display:grid;place-items:center}
.iconbtn[aria-pressed="true"]{color:var(--dim);text-decoration:line-through}
#bossbar{position:absolute;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));width:min(520px,calc(100% - 32px));text-align:center}
#bossbar span{font-family:var(--f-display);font-size:15px;letter-spacing:.08em;color:var(--rose);text-shadow:0 0 12px var(--rose)}
.bb{margin-top:6px;height:7px;border:1px solid rgba(255,79,163,.5);border-radius:2px;overflow:hidden;position:relative}
.bb i{position:absolute;inset:0 auto 0 0;width:100%;background:linear-gradient(90deg,#ff3355,var(--rose));box-shadow:0 0 12px var(--rose)}
#loadout{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:6px;font-family:var(--f-body);font-size:12px}
#loadout span{padding:3px 8px;border:1px solid var(--line);border-radius:4px;background:rgba(20,16,51,.55);color:var(--dim)}
#loadout span b{color:var(--ice);font-family:var(--f-num);margin-left:5px}
@media (max-width:560px){.hp .lbl{display:none}.hpbar{width:22vw}.right{gap:8px}.controls{grid-template-columns:repeat(2,minmax(0,1fr))}}

#banner{position:fixed;left:0;right:0;top:32%;text-align:center;pointer-events:none;font-family:var(--f-display);font-size:clamp(26px,6vw,46px);letter-spacing:.04em;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:pulse .5s ease-in-out infinite alternate}
#banner.warn{color:var(--rose);text-shadow:0 0 24px var(--rose)}
#banner.info{color:var(--amber);text-shadow:0 0 24px var(--amber)}
#banner small{display:block;font-family:var(--f-body);font-size:14px;letter-spacing:.1em;color:var(--ink);opacity:.8;margin-top:6px}
@keyframes pulse{from{opacity:1}to{opacity:.55}}

/* ---------- Screens ---------- */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow-y:auto;padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:radial-gradient(ellipse at center,rgba(7,6,20,.55),rgba(7,6,20,.88));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.panel{width:100%;max-width:760px;margin:auto;display:flex;flex-direction:column;gap:22px}
.eyebrow{font-family:var(--f-num);font-size:12px;letter-spacing:.32em;color:var(--ice);text-transform:uppercase}
.btn{border:1px solid var(--ice);background:rgba(126,240,255,.08);padding:13px 26px;border-radius:6px;font-weight:700;font-size:16px;letter-spacing:.04em;color:var(--ink);transition:background .15s,box-shadow .15s}
.btn:hover{background:rgba(126,240,255,.18);box-shadow:0 0 22px rgba(126,240,255,.3)}
.btn.ghost{border-color:var(--line);background:transparent;color:var(--dim)}
.btn.ghost:hover{color:var(--ink);box-shadow:none;background:rgba(158,140,255,.08)}
.btn kbd{font-family:var(--f-num);font-size:12px;opacity:.6;margin-left:8px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* title */
#title .panel{max-width:640px}
.logo{display:flex;flex-direction:column;gap:2px}
.logo h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(76px,19vw,150px);line-height:.92;letter-spacing:-.01em;background:linear-gradient(180deg,#fff 10%,var(--ice) 55%,#5b6bff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 26px rgba(126,240,255,.35))}
.logo .en{font-family:var(--f-num);font-weight:700;font-size:clamp(13px,2.6vw,17px);letter-spacing:.62em;color:var(--dim)}
.lede{margin:0;font-size:17px;line-height:1.7;max-width:34em;color:var(--ink)}
.lede em{font-style:normal;color:var(--amber)}
.controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 18px;font-size:13px;color:var(--dim)}
.controls div{display:flex;flex-direction:column;gap:3px;border-left:1px solid var(--line);padding-left:10px}
.controls b{color:var(--ink);font-family:var(--f-num);letter-spacing:.04em;font-size:14px}
.best{font-family:var(--f-num);font-size:13px;color:var(--dim);letter-spacing:.06em}
.best b{color:var(--amber);font-weight:700}

/* level up */
#levelup h2,#over h2,#pause h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(40px,9vw,64px);line-height:1;text-wrap:balance}
#levelup h2{color:var(--amber);text-shadow:0 0 28px rgba(255,194,74,.45)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:640px){.cards{grid-template-columns:1fr}}
.card{position:relative;text-align:left;display:flex;flex-direction:column;gap:10px;padding:18px 18px 16px;min-width:0;border:1px solid var(--line);border-radius:10px;background:linear-gradient(180deg,rgba(32,26,74,.92),rgba(16,13,40,.92));transition:transform .12s,border-color .12s,box-shadow .12s}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--c,var(--ice));box-shadow:0 0 0 1px var(--c,var(--ice)),0 10px 34px -8px var(--c,var(--ice));outline:none}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{font-size:11px;font-weight:700;letter-spacing:.12em;padding:3px 8px;border-radius:3px;color:var(--void);background:var(--c,var(--ice))}
.card .key{font-family:var(--f-num);font-size:12px;color:var(--dim)}
.card h3{margin:0;font-size:20px;font-weight:900;line-height:1.25}
.pips{display:flex;gap:4px}
.pips i{width:14px;height:4px;border-radius:1px;background:rgba(158,140,255,.25)}
.pips i.on{background:var(--c,var(--ice));box-shadow:0 0 6px var(--c,var(--ice))}
.pips i.new{background:#fff;box-shadow:0 0 8px #fff}
.card p{margin:0;font-size:14px;line-height:1.6;color:var(--dim)}
.card .lv{font-family:var(--f-num);font-size:12px;color:var(--c,var(--ice));letter-spacing:.06em}

/* end */
#over h2.win{color:var(--amber);text-shadow:0 0 28px rgba(255,194,74,.45)}
#over h2.lose{color:var(--rose);text-shadow:0 0 28px rgba(255,79,163,.45)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stats div{background:rgba(16,13,40,.92);padding:14px 14px 12px;display:flex;flex-direction:column;gap:4px}
.stats span{font-size:12px;color:var(--dim);letter-spacing:.08em}
.stats b{font-family:var(--f-num);font-size:26px;font-variant-numeric:tabular-nums}
.stats .rec{font-size:11px;color:var(--amber);letter-spacing:.1em;font-family:var(--f-num)}
.build{display:flex;flex-wrap:wrap;gap:6px;font-size:13px}
.build span{padding:4px 9px;border:1px solid var(--line);border-radius:4px;color:var(--dim)}
.build b{color:var(--ice);font-family:var(--f-num);margin-left:5px}
.sub{margin:0;color:var(--dim);font-size:15px;line-height:1.6}
@media (prefers-reduced-motion:reduce){#banner{animation:none}.card{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="게임 화면"></canvas>

<div id="hud" hidden>
  <div class="xpbar"><i id="xpfill"></i></div>
  <div class="hud-top">
    <div class="hp"><span class="lbl">HULL</span><div class="hpbar"><i id="hpfill"></i></div><b id="hptext">100</b></div>
    <div class="timer" id="timer">00:00</div>
    <div class="right">
      <span class="stat"><span class="lbl">LV</span><b id="lvl">1</b></span>
      <span class="stat"><span class="lbl">처치</span><b id="kills">0</b></span>
      <button class="iconbtn" id="btnMute" aria-pressed="false" aria-label="소리 켜고 끄기">♪</button>
      <button class="iconbtn" id="btnPause" aria-label="일시정지">II</button>
    </div>
  </div>
  <div id="bossbar" hidden><span id="bossname">하이브 코어</span><div class="bb"><i id="bossfill"></i></div></div>
  <div id="loadout"></div>
</div>
<div id="banner" hidden></div>

<section class="screen" id="title">
  <div class="panel">
    <div class="logo">
      <span class="en">STARDRIFT</span>
      <h1>별표류</h1>
    </div>
    <p class="lede">항로를 잃은 정찰기 한 대. 무리는 끝없이 몰려온다. <em>10분</em>을 버티면 구조선이 온다. 무기는 알아서 쏜다. 너는 피하고, 모으고, 고르기만 하면 된다.</p>
    <div class="controls">
      <div><b>WASD · 방향키</b>이동</div>
      <div><b>화면 드래그</b>이동 (터치·마우스)</div>
      <div><b>1 · 2 · 3</b>강화 선택</div>
      <div><b>Esc · P</b>일시정지</div>
    </div>
    <div class="row">
      <button class="btn" id="btnStart">출격 <kbd>Enter</kbd></button>
      <span class="best" id="bestLine">최고 기록 없음</span>
    </div>
  </div>
</section>

<section class="screen" id="levelup" hidden>
  <div class="panel">
    <div>
      <div class="eyebrow" id="luEyebrow">LEVEL 2</div>
      <h2>강화를 고르세요</h2>
    </div>
    <div class="cards" id="cards"></div>
    <div class="row"><button class="btn ghost" id="btnReroll">다시 뽑기 <kbd>R</kbd></button></div>
  </div>
</section>

<section class="screen" id="pause" hidden>
  <div class="panel">
    <div><div class="eyebrow">PAUSED</div><h2>일시정지</h2></div>
    <div class="build" id="pauseBuild"></div>
    <div class="row">
      <button class="btn" id="btnResume">계속 <kbd>Esc</kbd></button>
      <button class="btn ghost" id="btnQuit">포기하고 처음으로</button>
    </div>
  </div>
</section>

<section class="screen" id="over" hidden>
  <div class="panel">
    <div><div class="eyebrow" id="overEyebrow">MISSION LOG</div><h2 id="overTitle" class="lose">격추됨</h2></div>
    <p class="sub" id="overSub"></p>
    <div class="stats" id="overStats"></div>
    <div class="build" id="overBuild"></div>
    <div class="row">
      <button class="btn" id="btnAgain">다시 출격 <kbd>Enter</kbd></button>
      <button class="btn ghost" id="btnEndless" hidden>계속 싸우기 (무한 모드)</button>
      <button class="btn ghost" id="btnHome">처음으로</button>
    </div>
  </div>
</section>

<script>
(() => {
'use strict';

/* ============================================================
   utilities
   ============================================================ */
const TAU = Math.PI * 2;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const fmtT = s => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem('stardrift.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('stardrift.' + k, JSON.stringify(v)); } catch (e) {} }
};
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

const COL = {
  player: '#7ef0ff', pbullet: '#dffcff', blade: '#a8f6ff',
  drone: '#ff4fa3', dasher: '#ff7a45', spitter: '#b77bff', splitter: '#3dffb0', mite: '#3dffb0', brute: '#ff3355', boss: '#ff4fa3',
  ebullet: '#ff9ccf', xp1: '#ffc24a', xp2: '#ff8d3a', xp3: '#d4ff5a',
  heal: '#5affb4', chest: '#ffe27a', magnet: '#7ef0ff', bolt: '#c8ecff', missile: '#ffd27a', elite: '#ffe27a'
};
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }

/* ============================================================
   canvas & glow sprites
   ============================================================ */
const cv = $('c'), ctx = cv.getContext('2d');
let VW = 0, VH = 0, DPR = 1, SC = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = innerWidth; VH = innerHeight;
  cv.width = Math.floor(VW * DPR); cv.height = Math.floor(VH * DPR);
  cv.style.width = VW + 'px'; cv.style.height = VH + 'px';
  SC = clamp(Math.min(VW, VH) / 760, 0.58, 1.15);
}
addEventListener('resize', resize); resize();

const glowCache = new Map();
function glow(color, r, a = 0.55) {
  r = Math.max(4, Math.round(r));
  const k = color + r + a;
  let c = glowCache.get(k);
  if (!c) {
    c = document.createElement('canvas'); c.width = c.height = r * 2;
    const g = c.getContext('2d'), gr = g.createRadialGradient(r, r, 0, r, r, r);
    gr.addColorStop(0, hexA(color, a)); gr.addColorStop(0.35, hexA(color, a * 0.45)); gr.addColorStop(1, hexA(color, 0));
    g.fillStyle = gr; g.fillRect(0, 0, r * 2, r * 2);
    glowCache.set(k, c);
  }
  return c;
}
function drawGlow(color, x, y, r, a) { const s = glow(color, r, a); ctx.drawImage(s, x - s.width / 2, y - s.height / 2); }

/* background: nebula + parallax stars */
const NEB = (() => {
  const s = 1024, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');
  const blobs = [['#5b3bff', .16], ['#ff4fa3', .09], ['#1fb5ff', .1], ['#7a2cff', .12], ['#ff7a45', .05]];
  for (let i = 0; i < 14; i++) {
    const [col, a] = blobs[i % blobs.length];
    const x = rnd(s), y = rnd(s), r = rnd(160, 380);
    for (const ox of [-s, 0, s]) for (const oy of [-s, 0, s]) {
      const gr = g.createRadialGradient(x + ox, y + oy, 0, x + ox, y + oy, r);
      gr.addColorStop(0, hexA(col, a)); gr.addColorStop(1, hexA(col, 0));
      g.fillStyle = gr; g.fillRect(x + ox - r, y + oy - r, r * 2, r * 2);
    }
  }
  return c;
})();
const STAR_TILE = 900;
const STARS = [0.15, 0.35, 0.6].map((f, li) => ({
  f, list: Array.from({ length: 70 - li * 15 }, () => ({ x: rnd(STAR_TILE), y: rnd(STAR_TILE), s: rnd(0.6, 1.4) + li * 0.5, tw: rnd(TAU), c: Math.random() < 0.18 ? '#ffd9f0' : Math.random() < 0.3 ? '#bdf6ff' : '#ffffff' }))
}));

/* ============================================================
   audio (all synthesized)
   ============================================================ */
const A = {
  c: null, muted: store.get('muted', false), last: {}, seq: null,
  init() {
    if (this.c) { if (this.c.state === 'suspended') this.c.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try { this.c = new AC(); } catch (e) { return; }
    const c = this.c;
    this.out = c.createGain(); this.out.gain.value = this.muted ? 0 : 0.6;
    const comp = c.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 6;
    this.out.connect(comp); comp.connect(c.destination);
    this.sfx = c.createGain(); this.sfx.gain.value = 0.8; this.sfx.connect(this.out);
    this.mus = c.createGain(); this.mus.gain.value = 0.3; this.mus.connect(this.out);
    const len = c.sampleRate, b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.nbuf = b;
  },
  setMuted(m) { this.muted = m; store.set('muted', m); if (this.out) this.out.gain.setTargetAtTime(m ? 0 : 0.6, this.c.currentTime, 0.02); },
  gate(k, gap) { if (!this.c || this.muted) return false; const t = this.c.currentTime; if (this.last[k] && t - this.last[k] < gap) return false; this.last[k] = t; return true; },
  tone(f, dur, type = 'square', vol = .2, f2, dest, when) {
    const c = this.c, t = when || c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.sfx); o.start(t); o.stop(t + dur + 0.03);
  },
  noise(dur, vol, freq, ftype = 'lowpass', dest, when) {
    const c = this.c, t = when || c.currentTime;
    const s = c.createBufferSource(); s.buffer = this.nbuf;
    const f = c.createBiquadFilter(); f.type = ftype; f.frequency.value = freq;
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest || this.sfx); s.start(t, rnd(0.5)); s.stop(t + dur + 0.03);
  },

/* ============================================================
   spatial grid
   ============================================================ */
const CELL = 80, MAXR = 50;
const grid = new Map();
const gk = (cx, cy) => cx * 100003 + cy;
function buildGrid() {
  grid.clear();
  for (const e of enemies) {
    if (e.dead) continue;
    const k = gk(Math.floor(e.x / CELL), Math.floor(e.y / CELL));
    let a = grid.get(k); if (!a) { a = []; grid.set(k, a); } a.push(e);
  }
}
function forNear(x, y, r, fn) {
  const m = r + MAXR;
  const x0 = Math.floor((x - m) / CELL), x1 = Math.floor((x + m) / CELL), y0 = Math.floor((y - m) / CELL), y1 = Math.floor((y + m) / CELL);
  for (let cx = x0; cx <= x1; cx++) for (let cy = y0; cy <= y1; cy++) {
    const a = grid.get(gk(cx, cy)); if (!a) continue;
    for (let i = 0; i < a.length; i++) {
      const e = a[i]; if (e.dead) continue;
      const dx = e.x - x, dy = e.y - y, rr = r + e.r;
      if (dx * dx + dy * dy < rr * rr && fn(e) === true) return true;
    }
  }
  return false;
}
function nearest(x, y, maxD, skip) {
  let b = null, bd = maxD * maxD;
  for (const e of enemies) {
    if (e.dead || (skip && skip.has(e))) continue;
    const dx = e.x - x, dy = e.y - y, d = dx * dx + dy * dy;
    if (d < bd) { bd = d; b = e; }
  }
  return b;
}

/* ============================================================
   input

const keys = new Set();

addEventListener('keydown', e => {

  keys.add(k);

  if (!G || G.state === 'title') { if (k === 'enter' || k === ' ') startRun(); return; }
  if (G.state === 'play' && (k === 'escape' || k === 'p')) return pauseRun();
  if (G.state === 'paused' && (k === 'escape' || k === 'p')) return resumeRun();
  if (G.state === 'levelup') { if (k >= '1' && k <= '3') pickUpgrade(+k - 1); if (k === 'r') reroll(); }
  if ((G.state === 'over' || G.state === 'win') && k === 'enter') startRun();
  if (k === 'm') toggleMute();
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => { keys.clear(); joy.on = false; if (G && G.state === 'play') pauseRun(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && G && G.state === 'play') pauseRun(); });

  A.init();

  joy.on = true; joy.id = e.pointerId; joy.bx = joy.x = e.clientX; joy.by = joy.y = e.clientY;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}

  if (keys.has('a') || keys.has('arrowleft')) x--;
  if (keys.has('d') || keys.has('arrowright')) x++;
  if (keys.has('w') || keys.has('arrowup')) y--;
  if (keys.has('s') || keys.has('arrowdown')) y++;
  if (joy.on) {
    const dx = joy.x - joy.bx, dy = joy.y - joy.by, d = Math.hypot(dx, dy);
    if (d > 6) { const m = Math.min(1, d / 56); x = dx / d * m; y = dy / d * m; }

/* ============================================================
   update
   ============================================================ */
function update(dt) {
  G.t += dt;
  if (!G.won && G.t >= 600) { G.won = true; endRun(true); return; }

  /* player */
  const [ix, iy] = inputDir();
  const ax = ix * S.speed, ay = iy * S.speed;
  P.vx += (ax - P.vx) * Math.min(1, dt * 12); P.vy += (ay - P.vy) * Math.min(1, dt * 12);
  P.x += P.vx * dt; P.y += P.vy * dt;
  if (P.inv > 0) P.inv -= dt;
  if (S.regen && P.hp < P.maxHp) P.hp = Math.min(P.maxHp, P.hp + S.regen * dt);
  if (Math.hypot(P.vx, P.vy) > 40 && parts.length < 1400 && Math.random() < .7) {
    const a = Math.atan2(P.vy, P.vx) + Math.PI;
    parts.push({ x: P.x + Math.cos(a) * 10, y: P.y + Math.sin(a) * 10, vx: Math.cos(a + rnd(-.4, .4)) * 90, vy: Math.sin(a + rnd(-.4, .4)) * 90, life: .32, max: .32, color: COL.player, size: 2 });
  }
  if (G.comboT > 0) { G.comboT -= dt; if (G.comboT <= 0) G.combo = 0; }

  director(dt);
  for (const e of enemies) if (!e.dead) updateEnemy(e, dt);
  buildGrid(); separate();

  /* weapons */
  fireBlaster(dt); updateOrbit(dt); updateChain(dt); updateNova(dt); updateMissiles(dt); updateShield(dt);

  /* player bullets */
  for (const b of bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0) { b.dead = true; continue; }
    forNear(b.x, b.y, 4, e => {
      if (b.hit.includes(e.id)) return;
      b.hit.push(e.id);
      hurtEnemy(e, b.dmg, b.vx * .14, b.vy * .14);
      if (b.pierce-- <= 0) { b.dead = true; burst(b.x, b.y, COL.pbullet, 3, 90, 1.6, .2); return true; }
    });
  }
  bullets = bullets.filter(b => !b.dead);

  /* contact */
  forNear(P.x, P.y, P.r - 2, e => { hurtPlayer(e.dmg, e.x, e.y); return true; });
  for (const b of ebullets) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    const dx = b.x - P.x, dy = b.y - P.y, rr = b.r + P.r - 4;
    if (dx * dx + dy * dy < rr * rr && P.inv <= 0) { b.life = 0; hurtPlayer(b.dmg); }
  }
  ebullets = ebullets.filter(b => b.life > 0);
  enemies = enemies.filter(e => !e.dead);

  /* gems */
  const mag = S.magnet, mag2 = mag * mag;
  for (const g of gems) {
    const dx = P.x - g.x, dy = P.y - g.y, d2 = dx * dx + dy * dy;
    if (d2 < mag2) g.pull = true;
    if (g.pull) {
      const d = Math.sqrt(d2) || 1, s = 520 + (g.pullBoost || 0);
      g.vx += (dx / d * s - g.vx) * Math.min(1, dt * 7); g.vy += (dy / d * s - g.vy) * Math.min(1, dt * 7);
    } else { g.vx *= .92; g.vy *= .92; }
    g.x += g.vx * dt; g.y += g.vy * dt; g.rot += dt * 2;
    if (d2 < (P.r + 10) * (P.r + 10)) { g.got = true; gainXp(g.v); }
  }
  gems = gems.filter(g => !g.got);

  /* pickups */
  for (const p of pickups) {
    p.t += dt;
    const dx = P.x - p.x, dy = P.y - p.y, d = Math.hypot(dx, dy);
    if (d < mag * .8) { p.x += dx / d * 360 * dt; p.y += dy / d * 360 * dt; }
    if (d < P.r + 14) {
      p.got = true;
      if (p.k === 'heal') { P.hp = Math.min(P.maxHp, P.hp + 30); A.heal(); texts.push({ x: P.x, y: P.y - 24, v: -40, life: 1, max: 1, txt: '+30', heal: true }); }
      if (p.k === 'magnet') { for (const g of gems) { g.pull = true; g.pullBoost = 400; } A.heal(); }
      if (p.k === 'chest') { G.pending++; A.level(); burst(p.x, p.y, COL.chest, 30, 220, 3, .7); }
    }
  }
  pickups = pickups.filter(p => !p.got);

  /* fx timers */
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .95; p.vy *= .95; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const t of texts) { t.y += t.v * dt; t.v *= .93; t.life -= dt; }
  texts = texts.filter(t => t.life > 0);
  for (const f of fx) { f.life -= dt; if (f.follow) { f.x = P.x; f.y = P.y; } }
  fx = fx.filter(f => f.life > 0);
  G.shake *= Math.exp(-10 * dt); G.flash = Math.max(0, G.flash - dt * 1.6); G.hurt = Math.max(0, G.hurt - dt * 1.8);

  if (G.pending > 0 && G.state === 'play') openLevelUp();
  updateHud();
}
function gainXp(v) {
  P.xp += v; G.score += v * 2;
  A.pick(G.pickCombo = (G.pickT > 0 ? (G.pickCombo || 0) + 1 : 0)); G.pickT = .4;
  while (P.xp >= P.next) { P.xp -= P.next; P.level++; P.next = xpNeed(P.level); G.pending++; }
}

    : '레벨 업에서 범위 무기(칼날·충격파)를 일찍 잡으면 포위망을 버티기 쉽다.';
  const st = $('overStats'); st.innerHTML = '';
  [['생존 시간', fmtT(G.t)], ['레벨', P.level], ['처치', G.kills.toLocaleString('ko-KR')], ['점수', G.score.toLocaleString('ko-KR')]].forEach(([k, v], i) => {
    const d = document.createElement('div'), s = document.createElement('span'), b = document.createElement('b');
    s.textContent = k; b.textContent = v; d.append(s, b);
    if (i === 3 && isBest) { const r = document.createElement('span'); r.className = 'rec'; r.textContent = 'NEW BEST'; d.appendChild(r); }
    st.appendChild(d);
  });
  buildChips($('overBuild'));
  $('btnEndless').hidden = !win;
  $('hud').hidden = true; $('bossbar').hidden = true;
  setTimeout(() => show('over'), win ? 300 : 900);
  updateBest();
}
function updateBest() {
  const el = $('bestLine');
  if (!BEST) { el.textContent = '최고 기록 없음'; return; }
  el.textContent = '최고 기록  ';
  const b = document.createElement('b'); b.textContent = BEST.score.toLocaleString('ko-KR') + '점';
  el.append(b, '  ·  ' + fmtT(BEST.t) + ' 생존 · LV ' + BEST.level);
}
function toggleMute() { A.init(); A.setMuted(!A.muted); $('btnMute').setAttribute('aria-pressed', String(A.muted)); }

$('btnStart').onclick = startRun;
$('btnAgain').onclick = startRun;
$('btnHome').onclick = () => { G = null; show('title'); $('hud').hidden = true; };
$('btnQuit').onclick = () => { A.stopMusic(); G = null; show('title'); $('hud').hidden = true; };
$('btnResume').onclick = resumeRun;
$('btnPause').onclick = pauseRun;
$('btnMute').onclick = toggleMute;
$('btnReroll').onclick = reroll;
$('btnEndless').onclick = () => { G.endless = true; G.state = 'play'; show(null); $('hud').hidden = false; if (G.boss) $('bossbar').hidden = false; A.startMusic(); P.hp = P.maxHp; };
$('btnMute').setAttribute('aria-pressed', String(A.muted));
updateBest();

/* ============================================================
   loop
   ============================================================ */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (G && G.state === 'play') { G.pickT = (G.pickT || 0) - dt; update(dt); }
  render(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* test hook: lets an automated run play the game headlessly */
window.__stardrift = {
  get G() { return G; }, get P() { return P; }, get W() { return W; }, get S() { return S; },
  get counts() { return { enemies: enemies.length, bullets: bullets.length, ebullets: ebullets.length, gems: gems.length, parts: parts.length }; },
  start: startRun,
  autopilot(on) {
    AUTO = on ? () => {
      let fx_ = 0, fy_ = 0;
      /* repulsion from close threats, attraction to the best nearby gem cluster */
      for (const e of enemies) { const dx = P.x - e.x, dy = P.y - e.y, d2 = dx * dx + dy * dy + 1, R = e.type === 'boss' ? 320 : 150 + e.r; if (d2 < R * R) { const w = (e.type === 'boss' ? 4 : 1) / Math.sqrt(d2); fx_ += dx / Math.sqrt(d2) * w * 60; fy_ += dy / Math.sqrt(d2) * w * 60; } }
      for (const b of ebullets) { const dx = P.x - b.x, dy = P.y - b.y, d2 = dx * dx + dy * dy + 1; if (d2 < 110 * 110) { const d = Math.sqrt(d2); fx_ += dx / d * 120 / d; fy_ += dy / d * 120 / d; } }
      let g = null, gs = 0; for (const q of gems) { const d = Math.hypot(q.x - P.x, q.y - P.y) + 30; const s = q.v / d; if (s > gs) { gs = s; g = q; } }
      for (const q of pickups) { const d = Math.hypot(q.x - P.x, q.y - P.y) + 30; if (8 / d > gs) { gs = 8 / d; g = q; } }
      let x = fx_, y = fy_;
      if (g) { const d = Math.hypot(g.x - P.x, g.y - P.y) || 1; x += (g.x - P.x) / d * .9; y += (g.y - P.y) / d * .9; }
      x += Math.cos(G.t * .7) * .2; y += Math.sin(G.t * .5) * .2;
      const m = Math.hypot(x, y) || 1; return [x / m, y / m];
    } : null;
  },
  sim(seconds, step = 1 / 60) {
    const n = Math.round(seconds / step);
    for (let i = 0; i < n; i++) {
      while (G.state === 'levelup') pickUpgrade(Math.floor(Math.random() * 3));
      if (G.state !== 'play') break;
      G.pickT = (G.pickT || 0) - step; update(step);
    }
    return { t: G.t, state: G.state, level: P.level, hp: P.hp, kills: G.kills, enemies: enemies.length };
  },
  pick: i => pickUpgrade(i),
  end: win => endRun(!!win)
};
})();
</script>
